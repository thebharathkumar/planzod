# Render blueprint — connect this repo to Render and it auto-creates the
# Planzo API service. After Render provisions, set DATABASE_URL (Supabase),
# CORS_ORIGIN, and WEB_BASE_URL in the dashboard. Everything else is
# generated automatically or has a default.

services:
  - type: web
    name: planzo-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev && npm --workspace @planzo/shared run build
    startCommand: npm --workspace @planzo/api run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d

      # Set in dashboard — sync:false means Render keeps it as a secret.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: WEB_BASE_URL
        sync: false

      # Optional integrations — leave blank to disable.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SES_REGION
        sync: false

      # Auto-generated by Render the first time the service is created.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TICKET_QR_SECRET
        generateValue: true
